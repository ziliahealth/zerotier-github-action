name: "ZeroTier"
description: "Connect your Github Action workflow to ZeroTier"
branding:
  icon: "globe"
  color: "gray-dark"

on:
  workflow_call:

inputs:
  network_id:
    description: "The ZeroTier network ID to connect to"
    required: true
  auth_token:
    description: "Your ZeroTier Central API Access Token"
    required: true
  api_url:
    description: "ZeroTier Central API URL"
    required: false
    default: "https://my.zerotier.com/api/v1"
  tags:
    description: >
      When provided, set tags for the network member (space-separated list of numeric "key=value" pairs).
      The tags must be already defined on ZeroTier Central.
    required: false
    default: ""
  capabilities:
    description: >
      When provided, set capabilities for the network member (space-separated numeric list).
      The capabilities must be already defined on ZeroTier Central.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: zerotier
      uses: zerotier/github-action/util/post@main
      env:
        API_URL: ${{ inputs.api_url }}
        AUTH_TOKEN: ${{ inputs.auth_token }}
        NETWORK_ID: ${{ inputs.network_id }}
        TAGS: ${{ inputs.tags }}
        CAPABILITIES: ${{ inputs.capabilities }}
      with:
        main: $GITHUB_ACTION_PATH/main.sh
        post: $GITHUB_ACTION_PATH/post.sh
